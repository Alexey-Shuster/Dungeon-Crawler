name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clang-format_build-and-test:
    name: Check code style, Build and Test project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check code, Build and Test
        uses: actions/checkout@v4

      - name: Verify .clang-format exists
        run: test -f .clang-format || (echo "::error ::.clang-format not found" && exit 1)

      - name: Install clang-format
        run: python -m pip install clang-format==22.1.0

      - name: Show clang-format version
        run: clang-format --version

      - name: Check formatting
        run: |
          find . \
          -path './.git' -prune -o \
          -path './build' -prune -o \
          -path './cmake-build-*' -prune -o \
          -type f \( \
          -name '*.cpp' -o \
          -name '*.hpp' -o \
          -name '*.cc' -o \
          -name '*.cxx' -o \
          -name '*.h' -o \
          -name '*.c' \
          \) \
          -exec clang-format --dry-run --Werror --style=file {} +

      - name: Install Conan
        run: pipx install "conan>=2,<3"

      - name: Detect and Show Conan profile
        run: |
          conan profile detect --force
          conan profile show

      - name: Cache Conan packages (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/s
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Conan install
        run: conan install . -s build_type=Release -s compiler.cppstd=20 -b missing

      - name: Cache Conan packages (save)
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/s
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock') }}-${{ github.run_id }}

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version
          g++ --version
          conan --version

      - name: Install X11
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure
        run: >
          cmake --preset conan-release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test
        run: ctest --preset conan-release --output-on-failure
